; Production PHP settings for the Early Warning container.

expose_php = Off
memory_limit = 256M
date.timezone = UTC

; Profile pictures are limited to 4 MB by the app; leave some headroom.
upload_max_filesize = 8M
post_max_size = 10M

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
